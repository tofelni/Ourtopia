  const d=Math.hypot(FP.x,FP.z);if(d>100){FP.x*=100/d;FP.z*=100/d}
  FP.y=clamp(FP.y,hgt(FP.x,FP.z)+.5,120)}

  const C=CAMS[CAMI],u=ease(((t/DUR)%2<1)?(t/DUR)%1:1-(t/DUR)%1);cam.position.lerpVectors(C.p0,C.p1,u);tgt.lerpVectors(C.t0,C.t1,u);cam.lookAt(tgt);cam.fov=C.fov;cam.updateProjectionMatrix();
  const sp=V(SG.x,hgt(SG.x,SG.z)+2.2,SG.z);FIN.material.uniforms.foc.value=C.focus=='sign'?cam.position.distanceTo(sp):cam.position.distanceTo(tgt);FIN.material.uniforms.dof.value=C.dof}

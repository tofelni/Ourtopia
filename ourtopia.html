#laden{position:fixed;inset:0;z-index:99;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;box-sizing:border-box;text-align:center;color:#fff8ec;font-family:Poppins,system-ui,sans-serif;transition:opacity .6s;
  background:linear-gradient(180deg,#141a3a 0%,#2d2f6b 38%,#7a3f7d 66%,#e0686a 86%,#f6a85f 100%)}
#laden.weg{opacity:0;pointer-events:none}
#laden s{position:absolute;width:3px;height:3px;border-radius:50%;background:#fff8ec;will-change:opacity;animation:ladenFunkeln 2.4s ease-in-out infinite both}
#laden .stadt{position:relative;width:270px;height:126px;margin-bottom:30px}
#laden .sonne{position:absolute;left:70px;bottom:18px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle,#ffd98a 0%,#ffb05c 45%,rgba(255,140,90,0) 70%);will-change:transform;animation:ladenSonne 3.6s ease-in-out infinite both}
#laden .boden{position:absolute;left:-20px;right:-20px;bottom:2px;height:4px;border-radius:2px;background:#fff8ec;opacity:.55}
#laden .h{position:absolute;bottom:6px;border-radius:3px;transform-origin:50% 100%;box-shadow:inset -5px 0 0 rgba(20,26,58,.18);will-change:transform,opacity;animation:ladenBau 3.6s cubic-bezier(.3,1.4,.5,1) infinite both}
#laden .h i{position:absolute;width:6px;height:7px;border-radius:1px;background:#2d2f6b}
#laden .h i::after{content:"";position:absolute;inset:0;border-radius:1px;background:#ffd166;opacity:0;will-change:opacity;animation:ladenLicht 3.6s infinite both;animation-delay:inherit}
#laden .b{position:absolute;bottom:6px;width:16px;height:16px;border-radius:50%;background:#57a773;transform-origin:50% 100%;will-change:transform,opacity;animation:ladenBaum 3.6s infinite both}
@keyframes ladenBau{0%{transform:scaleY(0)}18%,86%{transform:scaleY(1);opacity:1}96%,100%{transform:scaleY(1);opacity:0}}
@keyframes ladenLicht{0%,20%{opacity:0}28%,100%{opacity:1}}
@keyframes ladenBaum{0%,10%{transform:scale(0)}22%,86%{transform:scale(1);opacity:1}96%,100%{transform:scale(1);opacity:0}}
@keyframes ladenSonne{0%,100%{transform:translateY(14px) scale(.92)}50%{transform:translateY(0) scale(1.05)}}
@keyframes ladenFunkeln{0%,100%{opacity:.15}50%{opacity:1}}
#laden b{font-size:42px;font-weight:700;letter-spacing:.1em;line-height:1;text-shadow:0 3px 18px rgba(20,26,58,.45)}
#laden .balken{position:relative;width:220px;max-width:70vw;height:7px;margin-top:22px;border-radius:4px;background:rgba(255,248,236,.25);overflow:hidden}
#laden .balken i{position:absolute;inset:0;border-radius:4px;background:#ffd98a;transform-origin:0 50%;will-change:transform;animation:ladenBalken 30s linear both}
#laden.weg .balken i{animation:none;transform:scaleX(1);transition:transform .25s}
@keyframes ladenBalken{0%{transform:scaleX(.03)}4%{transform:scaleX(.35)}10%{transform:scaleX(.6)}23%{transform:scaleX(.75)}45%{transform:scaleX(.86)}100%{transform:scaleX(.97)}}
#laden p{max-width:380px;margin:16px 0 0;font-size:22px;font-weight:600;line-height:1.35;text-shadow:0 2px 12px rgba(20,26,58,.5)}
@media (max-width:420px){#laden b{font-size:36px}#laden p{font-size:19px}}
@media (prefers-reduced-motion:reduce){#laden .h,#laden .h i::after,#laden .b,#laden .sonne,#laden s{animation:none}#laden .h i::after{opacity:1}}
</style>
